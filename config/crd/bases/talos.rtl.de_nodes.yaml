---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: nodes.talos.rtl.de
spec:
  group: talos.rtl.de
  names:
    kind: Node
    listKind: NodeList
    plural: nodes
    singular: node
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Cluster this Node belongs to
      jsonPath: .spec.clusterRef
      name: Cluster
      type: string
    - description: Role of the Node in the cluster
      jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.talosVersion
      name: Talos
      type: string
    - jsonPath: .status.kubernetesVersions.kubelet
      name: Kubernetes
      type: string
    - description: Indicates if the Node has been provisioned
      jsonPath: .status.conditions[?(@.type=="Provisioned")].status
      name: Provisioned
      type: string
    - description: Indicates if the Node is ready
      jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - description: Indicates if the Node's configuration is in sync
      jsonPath: .status.conditions[?(@.type=="ConfigInSync")].status
      name: ConfigInSync
      type: string
    - description: Indicates if the Node's configuration is in sync
      jsonPath: .status.conditions[?(@.type=="KubernetesInSync")].status
      name: K8sInSync
      type: string
    - description: Current operation on the Node
      jsonPath: .status.operationStatus.type
      name: Operation
      type: string
    - description: Phase of the current operation on the Node
      jsonPath: .status.operationStatus.phase
      name: Operation Phase
      type: string
    - description: Last transition time of the current operation
      jsonPath: .status.operationStatus.lastTransitionTime
      name: Operation Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Node is the Schema for the nodes API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          operation:
            description: operation defines a requested operation on the Node
            properties:
              kubernetesComponentUpgrade:
                description: KubernetesComponentUpgrade contains arguments for the
                  KubernetesComponentUpgrade operation.
                properties:
                  componentName:
                    description: ComponentName is the name of the Kubernetes component
                      to upgrade
                    enum:
                    - apiserver
                    - controllerManager
                    - scheduler
                    - kubelet
                    type: string
                required:
                - componentName
                type: object
              options:
                description: Options contains additional options for the operation.
                properties:
                  unsafe:
                    description: |-
                      Unsafe indicates whether to perform the operation in unsafe mode, bypassing certain safety checks.
                      Commonly this means bypassing Kubernetes drain and uncordon operations.
                    type: boolean
                type: object
              provision:
                description: Provision contains arguments for the Provision operation.
                properties:
                  address:
                    description: Address is the IP / DNS address to find the Talos
                      node in maintenance mode.
                    type: string
                  skip:
                    description: Skip indicates whether to skip the provisioning operation.
                    type: boolean
                type: object
              reset:
                description: Reset contains arguments for the Reset operation.
                properties:
                  graceful:
                    default: true
                    description: Graceful indicates whether to perform a graceful
                      reset, allowing services to shut down properly and etcd members
                      to leave cleanly.
                    type: boolean
                  mode:
                    description: |-
                      Mode defines the mode of erasure for the reset operation.
                      (default "all" if no system labels or user disks are specified)
                    enum:
                    - all
                    - system-disk
                    - user-disks
                    type: string
                  reboot:
                    default: false
                    description: Reboot indicates whether to reboot the Node after
                      the reset operation.
                    type: boolean
                  systemLabelsToWipe:
                    description: |-
                      SystemLabelsToWipe is a list of specific system labels to wipe during the reset operation.
                      If empty, all system labels will be wiped, assuming the mode includes system-disk.
                    items:
                      type: string
                    type: array
                  userLabelsToWipe:
                    description: |-
                      UserDisksToWipe is a list of specific user disks to wipe during the reset operation.
                      If empty, all user disks will be wiped, assuming the mode includes user-disks.
                    items:
                      type: string
                    type: array
                type: object
              type:
                description: Type of operation to perform on the Node.
                enum:
                - Provision
                - Bootstrap
                - Apply
                - Upgrade
                - Reboot
                - Shutdown
                - Reset
                - KubernetesComponentUpgrade
                type: string
            required:
            - type
            type: object
          spec:
            description: spec defines the desired state of Node
            properties:
              clusterRef:
                description: ClusterRef references the Cluster this Node belongs to
                type: string
              patchRefs:
                description: PatchRefs is a list of references to ConfigMap resources
                  containing patches to be applied to this specific Node's Talos config.
                items:
                  description: PatchRef defines a reference to a ConfigMap containing
                    a patch.
                  properties:
                    key:
                      description: Key of the patch data in the ConfigMap. Defaults
                        to "patch.yaml" if not specified.
                      type: string
                    name:
                      description: Name of the ConfigMap containing the patch.
                      type: string
                    namespace:
                      description: |-
                        Namespace of the ConfigMap containing the patch.
                        Defaults to the same namespace as the Node or Cluster resource if not specified.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              patches:
                description: Patches is a list of inline YAML / JSON patches to be
                  applied to this specific Node's Talos config.
                items:
                  type: string
                type: array
              role:
                description: Role defines the role of the Node in the cluster (e.g.,
                  controlplane, worker).
                enum:
                - controlplane
                - worker
                type: string
            required:
            - clusterRef
            - role
            type: object
          status:
            description: status defines the observed state of Node
            properties:
              appliedConfigHash:
                description: AppliedConfigHash is the hash of the last successfully
                  applied configuration on the Node.
                type: string
              bootID:
                description: BootID is the unique boot identifier of the Node, used
                  to detect reboots.
                type: string
              conditions:
                description: |-
                  conditions represent the current state of the Node resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              effectiveConfig:
                description: EffectiveConfig is the configuration we expect to be
                  running on this node after applying all patches, without secrets.
                type: string
              kubernetesVersions:
                description: KubernetesVersions represents the versions of various
                  Kubernetes components running on the Node.
                properties:
                  apiServer:
                    type: string
                  controllerManager:
                    type: string
                  kubelet:
                    type: string
                  scheduler:
                    type: string
                type: object
              operationStatus:
                description: Operation provides details about the current operation
                  being performed on the Node.
                properties:
                  kubernetesComponentUpgrade:
                    description: KubernetesComponentUpgrade contains arguments for
                      the KubernetesComponentUpgrade operation.
                    properties:
                      componentName:
                        description: ComponentName is the name of the Kubernetes component
                          to upgrade
                        enum:
                        - apiserver
                        - controllerManager
                        - scheduler
                        - kubelet
                        type: string
                    required:
                    - componentName
                    type: object
                  lastTransitionTime:
                    description: LastTransitionTime is the last time the operation
                      changed phases.
                    format: date-time
                    type: string
                  message:
                    description: Message provides a human-readable message about the
                      operation.
                    type: string
                  options:
                    description: Options contains additional options for the operation.
                    properties:
                      unsafe:
                        description: |-
                          Unsafe indicates whether to perform the operation in unsafe mode, bypassing certain safety checks.
                          Commonly this means bypassing Kubernetes drain and uncordon operations.
                        type: boolean
                    type: object
                  phase:
                    description: Phase indicates the current phase of the operation.
                    type: string
                  provision:
                    description: Provision contains arguments for the Provision operation.
                    properties:
                      address:
                        description: Address is the IP / DNS address to find the Talos
                          node in maintenance mode.
                        type: string
                      skip:
                        description: Skip indicates whether to skip the provisioning
                          operation.
                        type: boolean
                    type: object
                  reason:
                    description: Reason provides a code or short description of why
                      the operation is in its current phase.
                    type: string
                  reset:
                    description: Reset contains arguments for the Reset operation.
                    properties:
                      graceful:
                        default: true
                        description: Graceful indicates whether to perform a graceful
                          reset, allowing services to shut down properly and etcd
                          members to leave cleanly.
                        type: boolean
                      mode:
                        description: |-
                          Mode defines the mode of erasure for the reset operation.
                          (default "all" if no system labels or user disks are specified)
                        enum:
                        - all
                        - system-disk
                        - user-disks
                        type: string
                      reboot:
                        default: false
                        description: Reboot indicates whether to reboot the Node after
                          the reset operation.
                        type: boolean
                      systemLabelsToWipe:
                        description: |-
                          SystemLabelsToWipe is a list of specific system labels to wipe during the reset operation.
                          If empty, all system labels will be wiped, assuming the mode includes system-disk.
                        items:
                          type: string
                        type: array
                      userLabelsToWipe:
                        description: |-
                          UserDisksToWipe is a list of specific user disks to wipe during the reset operation.
                          If empty, all user disks will be wiped, assuming the mode includes user-disks.
                        items:
                          type: string
                        type: array
                    type: object
                  type:
                    description: Type of operation to perform on the Node.
                    enum:
                    - Provision
                    - Bootstrap
                    - Apply
                    - Upgrade
                    - Reboot
                    - Shutdown
                    - Reset
                    - KubernetesComponentUpgrade
                    type: string
                required:
                - type
                type: object
              patchHierarchy:
                description: PatchHierarchy explains how the node config came to be.
                items:
                  description: PatchHierarchyElement represents a single element in
                    the patch hierarchy, which includes a reference to a patch and
                    the source of that patch.
                  properties:
                    patchRef:
                      description: PatchRef defines a reference to a ConfigMap containing
                        a patch.
                      properties:
                        key:
                          description: Key of the patch data in the ConfigMap. Defaults
                            to "patch.yaml" if not specified.
                          type: string
                        name:
                          description: Name of the ConfigMap containing the patch.
                          type: string
                        namespace:
                          description: |-
                            Namespace of the ConfigMap containing the patch.
                            Defaults to the same namespace as the Node or Cluster resource if not specified.
                          type: string
                      required:
                      - name
                      type: object
                    source:
                      description: where the patchref came from
                      type: string
                    synthetic:
                      description: if the patch was synthetic (i.e. generated by the
                        operator), this is where we explain why it was generated
                      type: boolean
                    syntheticExplanation:
                      type: string
                  required:
                  - source
                  type: object
                type: array
              talosSchematicID:
                description: TalosSchematicID is the schematic ID of the Talos version
                  currently running on the Node.
                type: string
              talosVersion:
                description: TalosVersion is the version of Talos currently running
                  on the Node.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
