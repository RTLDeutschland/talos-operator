{{- if .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.certManager.issuer.name }}
  labels:
    {{- include "talos-operator.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certManager.certificate.name }}
  labels:
    {{- include "talos-operator.labels" . | nindent 4 }}
spec:
  dnsNames:
    - {{ include "talos-operator.metricsServiceName" . }}.{{ .Release.Namespace }}.svc
    - {{ include "talos-operator.metricsServiceName" . }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: {{ .Values.certManager.issuer.kind }}
    name: {{ .Values.certManager.issuer.name }}
  secretName: {{ .Values.certManager.certificate.secretName }}
{{- end }}
